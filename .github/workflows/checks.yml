name: Checks

# The manual deployment also calls this workflow. No inputs, outputs, or secrets.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Formatting
            command: npm run format:check
          - name: Tests
            command: npm test -- --run
          - name: TypeScript
            command: npm run typecheck
          - name: Worker build
            command: npm run build
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: ${{ matrix.command }}
