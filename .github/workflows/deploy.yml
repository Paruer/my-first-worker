name: Deploy Worker

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment target
        required: true
        type: choice
        options: [production]

permissions:
  contents: read

jobs:
  checks:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-my-first-worker-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check smoke test URL
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: '[[ "$WORKER_URL" == https://* ]]'
      - name: Deploy my-first-worker
        run: npm run deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke-test the Worker
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: curl --fail --silent --show-error --retry 3 --max-time 20 --output /dev/null "$WORKER_URL"
      - name: Record release
        run: echo "Deployed $GITHUB_SHA to production." >> "$GITHUB_STEP_SUMMARY"
